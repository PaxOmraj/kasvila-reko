# Kasvila REKO: automaattinen rakennus ja julkaisu.
#
# * Jokainen push main-haaraan ja jokainen pull request: rakennetaan
#   allekirjoittamaton debug-APK. Näin nähdään heti, kääntyykö koodi.
#   APK on ladattavissa ajon "Artifacts"-kohdasta testausta varten.
# * Tagi vN (esim. v58): rakennetaan allekirjoitettu release-APK ja tehdään
#   GitHub-julkaisu, josta sovelluksen päivitystarkistus (UpdateChecker.kt)
#   löytää sen. Tagin numeron on oltava sama kuin versionCode.
#
# Allekirjoitus tarvitsee repon salaisuudet (Settings → Secrets and variables
# → Actions): KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# Ohje: docs/AUTOMAATTINEN_JULKAISU.md
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      julkaise:
        description: "Julkaise allekirjoitettu versio (tagi vN tehdään versionCodesta)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      # Julkaisu käynnistyy joko tagista vN tai käsin (Actions → Android →
      # Run workflow → julkaise). Käsin ajettaessa tagi tehdään versionCodesta.
      - name: Julkaisutila
        id: mode
        run: |
          CODE=$(grep -Po 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.julkaise }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "tag=v$CODE" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tarkistus (Ostot-testit, debug- ja release-rakennus)
        if: steps.mode.outputs.release != 'true'
        run: |
          set -o pipefail
          gradle --no-daemon :ostot:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log

      # Virheet näkyviin ajon yhteenvetoon (annotaatioina), jotta ne voi lukea
      # ilman lokitiedoston latausta.
      - name: Käännösvirheet yhteenvetoon
        if: failure()
        run: |
          # GitHub näyttää enintään 10 annotaatiota askelta kohden, joten
          # virheet kootaan yhteen monirivisenä viestinä.
          { grep -E "^e: |^w: .*error|What went wrong|FAILED|Exception|Unresolved|expected:" build.log | grep -v "^> Task" | head -30
            echo "----- lopusta -----"
            grep -v "^> Task" build.log | tail -40; } > errs.txt || true
          for f in ostot/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -A3 "<failure" "$f" | head -20 >> errs.txt
          done
          msg=$(sed -e 's/%/%25/g' errs.txt | cut -c1-300 | awk '{printf "%s%%0A", $0}')
          echo "::error title=Rakennusvirhe::${msg:0:60000}"
          true

      - name: Debug-APK talteen
        if: steps.mode.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kasvila-reko-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Tarkista tagi ja versionCode
        if: steps.mode.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
        run: |
          TAG="${RELEASE_TAG#v}"
          CODE=$(grep -Po 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "Tagi: $TAG, versionCode: $CODE"
          if [ "$TAG" != "$CODE" ]; then
            echo "::error::Tagi v$TAG ei vastaa versionCodea $CODE (app/build.gradle.kts)."
            exit 1
          fi

      - name: Allekirjoitusavain salaisuuksista
        if: steps.mode.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Allekirjoituksen salaisuudet puuttuvat. Katso docs/AUTOMAATTINEN_JULKAISU.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kasvila-reko.jks"
          {
            echo "storeFile=$RUNNER_TEMP/kasvila-reko.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > keystore.properties

      - name: Release-rakennus
        if: steps.mode.outputs.release == 'true'
        run: gradle --no-daemon :app:assembleRelease

      - name: Varmista allekirjoitus ja nimeä APK
        if: steps.mode.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
          # Sama avain kuin v57:ssä (kasvila-reko.jks, alias kasvila). Jos sormenjälki
          # ei täsmää, puhelin ei asentaisi päivitystä, joten julkaisu pysäytetään.
          EXPECTED_SHA256: "13986dd96198bf896f7b6e76df9ef83407a3bf97ec3be62a066f2deacc7b0ec2"
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Allekirjoitettua APK:ta ei syntynyt."; exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERTS=$("$BT/apksigner" verify --print-certs "$APK")
          echo "$CERTS" | head -3
          if ! echo "$CERTS" | grep -qi "SHA-256 digest: $EXPECTED_SHA256"; then
            echo "::error::APK on allekirjoitettu eri avaimella kuin v57. Tarkista KEYSTORE_BASE64."; exit 1
          fi
          cp "$APK" "kasvila-reko-${RELEASE_TAG}.apk"
          rm -f keystore.properties "$RUNNER_TEMP/kasvila-reko.jks"

      - name: Julkaisun kuvaus
        if: steps.mode.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
        run: |
          N="${RELEASE_TAG#v}"
          if [ -f "docs/julkaisut/v$N.md" ]; then
            cp "docs/julkaisut/v$N.md" release_notes.md
          elif [ -f "MUUTOKSET_v$N.md" ]; then
            cp "MUUTOKSET_v$N.md" release_notes.md
          else
            echo "Kasvila REKO $N" > release_notes.md
          fi

      - name: GitHub-julkaisu
        if: steps.mode.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.mode.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kasvila REKO ${{ steps.mode.outputs.tag }}
          body_path: release_notes.md
          files: kasvila-reko-${{ steps.mode.outputs.tag }}.apk
